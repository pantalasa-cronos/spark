apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
spec:
  project: platform
  source:
    repoURL: https://github.com/pantalasa-cronos/gitops.git
    path: manifests/frontend
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
